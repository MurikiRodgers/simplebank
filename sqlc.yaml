version: "2"
sql:
  - schema: "./db/migration/"
    queries: "./db/query/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "./db/sqlc"
        sql_package: "pgx/v5"
        # --- Optional Settings ---
        emit_json_tags: true            # Adds json tags to structs
        emit_prepared_queries: false     # Optimizes for prepared statements
        emit_interface: false            # Generates a Querier interface (useful for mocking/testing)
        emit_exact_table_names: false   # If false, singularizes struct names (Users table -> User struct)
